server {
    listen 443 ssl;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:RC4-SHA;
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_certificate     /etc/nginx/certs/legacy_rsa2048.crt;
    ssl_certificate_key /etc/nginx/certs/legacy_rsa2048.key;
}
